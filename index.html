<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Library</title>
  </head>
  <body>
    <header>
      <h1>My Personal Library</h1>
      <button id="open-modal-btn">Add New Book</button>
    </header>

    <main id="library-grid"></main>

    <div id="form-modal" class="modal">
      <div class="modal-content">
        <span id="close-modal-btn" class="close-btn">&times;</span>
        <h2>Add a New Book</h2>

        <form id="book-form">
          <label for="title">Title:</label>
          <input type="text" id="title" required />

          <label for="author">Author:</label>
          <input type="text" id="author" required />

          <label for="pages">Pages:</label>
          <input type="number" id="pages" required min="1" />

          <div class="form-checkbox-group">
            <input type="checkbox" id="read-status-input" />
            <label for="read-status-input">I have read this book</label>
          </div>

          <button type="submit">Add to Library</button>
        </form>
      </div>
    </div>
  </body>
</html>
